[pytest]
# Labs are independent folders that deliberately share file names
# (src/clean.py, tests/test_clean.py). importlib import mode lets pytest
# collect them all in one run without the modules shadowing each other.
addopts = --import-mode=importlib -q
testpaths = 01_missing_values 02_type_coercion 03_string_normalization 04_join_validation 05_cleaning_pipeline
